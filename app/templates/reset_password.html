{% extends "base.html" %}
{% block title %}Reset Password - Tax Computational Tool{% endblock %}
{% block public_content %}

<div class="auth-wrapper">
  <div class="card">
    <h1>Reset Your Password</h1>
    <p class="subtitle">Choose a new password for your account.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required autofocus />
          <button type="button" class="toggle-password" data-target="password">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="6" required />
          <button type="button" class="toggle-password" data-target="confirm_password">Show</button>
        </div>
      </div>

      <button type="submit" class="btn">Reset Password</button>
    </form>
  </div>
</div>

{% endblock %}
