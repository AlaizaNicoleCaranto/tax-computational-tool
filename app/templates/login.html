{% extends "base.html" %} {% block title %}Login - Tax Computational Tool{%
endblock %} {% block public_content %}

<div class="auth-wrapper">
  <div class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to continue to your tax calculator</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
          <button type="button" class="toggle-password" data-target="password">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="btn">Log In</button>
    </form>

    <div class="form-footer">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </div>

    <div class="form-footer">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>
  </div>
</div>

{% endblock %}
