{% extends "base.html" %}
{% block title %}Forgot Password - Tax Computational Tool{% endblock %}
{% block public_content %}

<div class="auth-wrapper">
  <div class="card">
    <h1>Forgot Password?</h1>
    <p class="subtitle">Enter your email and we’ll help you reset your password.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus />
      </div>
      <button type="submit" class="btn">Send Reset Instructions</button>
    </form>

    <div class="form-footer">
      Remembered your password?
      <a href="{{ url_for('auth.login') }}">Log in here</a>
    </div>
  </div>
</div>

{% endblock %}
