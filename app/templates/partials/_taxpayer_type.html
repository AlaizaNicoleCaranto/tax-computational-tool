{# ============================================================ PARTIAL:
TAXPAYER CLASSIFICATION (STEP 1)
============================================================ #}

<div class="wizard-step active" data-step="1">
  <div class="section">
    <div class="section-title">1. Taxpayer Classification</div>

    <div class="taxpayer-options">
      <label class="taxpayer-option">
        <div>
          <input type="radio" name="taxpayerType" value="pure" checked />
          <strong>Purely Single Proprietor or Professional</strong>
        </div>
        <div class="option-description">
          Taxpayer earns income from business or profession only.
        </div>
      </label>

      <label class="taxpayer-option">
        <div>
          <input type="radio" name="taxpayerType" value="mixed" />
          <strong>Mixed Income Earner</strong>
        </div>
        <div class="option-description">
          Compensation earner and single proprietor or professional.
        </div>
      </label>
    </div>
  </div>
</div>
